---
### Stages
##
#
stages:
  - test

### Cache
## the key is "branch_name:job_name" to prevent incompatibilities
## between node versions
#
cache:
  key: "${CI_COMMIT_REF_NAME}:${CI_JOB_NAME}"
  paths:
    - node_modules/

### Services
##
# Bring in any services we need
# http://docs.gitlab.com/ee/ci/docker/using_docker_images.html#what-is-a-service
services:
  - name: ghcr.io/rroemhild/docker-test-openldap
    alias: rroemhild-test-openldap

### Variables
##
#
variables:
  DEBIAN_FRONTEND: noninteractive
  VAR_SETTINGS_REG: "var settings = require('\\./spec/settings\\.js')"

### Template
##
#
.run_tests: &run_tests
  stage: test
  before_script:
    - if (grep -q "$VAR_SETTINGS_REG" auth.js configuration.js storage.js ||
          ! grep -q "peerDependencies" package.json); then
        echo -n "*** You have committed development patches. ";
        echo "Please run \"make unpatch-for-dev\" and commit ***";
        exit 1;
      fi
  script:
    - make patch-for-dev
    - npm clean-install
    - make patch-mithril
    - npm run frontend:build
    - git status
    - if (git status -- static/js/ |
          grep -q "nothing to commit, working tree clean"); then
        echo -n "*** You did’nt build the frontend! Aborting. ";
        echo "Please run \"make build\" and commit ***";
        exit 1;
      fi
    - npm run lint
    - npm run test
    - npm run test-ldap
  retry: 2

### Jobs
##
#

test-bullseye:
  image: node:$NODE_VERSION-bullseye
  <<: *run_tests
  parallel:
    matrix:
      - NODE_VERSION: ['18', '20', '22']

test-bookworm:
  image: node:$NODE_VERSION-bookworm
  <<: *run_tests
  parallel:
    matrix:
      - NODE_VERSION: ['18', '20', '22']

test-trixie:
  image: node:$NODE_VERSION-trixie
  <<: *run_tests
  parallel:
    matrix:
      - NODE_VERSION: ['20', '22']
