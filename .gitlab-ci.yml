### Stages
##
#
stages:
  - test

### Cache
## the key is "branch_name:job_name" to prevent incompatibilities between node versions
#
cache:
  key: "${CI_COMMIT_REF_NAME}:${CI_JOB_NAME}"
  paths:
    - node_modules/

### Services
##
# Bring in any services we need
# http://docs.gitlab.com/ee/ci/docker/using_docker_images.html#what-is-a-service
services:
  - rroemhild/test-openldap

### Template
##
#
.run_tests: &run_tests
  stage: test
  script:
    - npm install
    - npm run frontend:build
    - git status
    - git checkout -- package-lock.json
    - if [[ $(git status | grep -c "nothing to commit, working tree clean") -ne 1 ]]; then echo "*** You did’nt build the frontend! Aborting. Please run `make build` and commit ***"; exit 1; fi
    - npm run lint
    - npm run test
    - npm run test-ldap
  retry: 2

### Jobs
##
#

test-buster:
  <<: *run_tests
  image: node:$NODE_VERSION-buster
  parallel:
    matrix:
      - NODE_VERSION: ['18', '20']

test-bullseye:
  image: node:$NODE_VERSION-bullseye
  <<: *run_tests
  parallel:
    matrix:
      - NODE_VERSION: ['18', '20']

test-bookworm:
  image: node:$NODE_VERSION-bookworm
  <<: *run_tests
  parallel:
    matrix:
      - NODE_VERSION: ['18', '20']
