<!DOCTYPE html>
<!-- vim:set sw=2 ts=2 sts=2 ft=html expandtab: -->
<html>
  <head>
    <title>MyPads</title>
    <meta name="viewport"     content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta property="og:title" content="MyPads — Etherpad with accounts">
    <meta property="og:type"  content="website">
    <meta property="og:url"   content="<%= mypadsURL %>">
    <meta property="og:image" content="<%= mypadsURL %>img/mypads_fav.ico">
    <link href="css/mypads.css"                  rel="stylesheet">
    <link href="img/mypads_fav.ico"              rel="shortcut icon">
    <link href="css/mypads-hide-help-blocks.css" rel="stylesheet">
    <%= HTMLExtraHead %>
  </head>
  <body<%= (hideHelpBlocks) ? ' class="hidehelpblocks"' : '' %>>
    <header>
      <extended-uportal-header
        template-api-path="/commun/portal_template_api.tpl.json"
        fname="MyPads"
      >
      </extended-uportal-header>
    </header>
    <div id= "mypads"></div>
    <footer>
      <extended-uportal-footer
        template-api-path="/commun/portal_template_api.tpl.json"
      >
      </extended-uportal-footer>
    </footer>
    <script src="js/mypads.js"></script>
  </body>
</html>
